<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Rafraîchissement automatique toutes les 5 minutes (300 secondes) -->
    <meta http-equiv="refresh" content="300">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Agenda Parents</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Prochains Rendez-vous</h1>
    </header>

    <main>
        <!-- Rendez-vous du jour (classe "today") -->
        <article class="event-card today">
            <div class="event-date">AUJOURD'HUI &mdash; 14h30</div>
            <div class="event-title">Rendez-vous Docteur Martin</div>
            <div class="event-details">Cabinet des Lilas &bull; Ne pas oublier la carte Vitale</div>
        </article>

        <!-- Rendez-vous à venir (classe standard) -->
        <article class="event-card">
            <div class="event-date">Jeudi 19 Novembre &mdash; 10h00</div>
            <div class="event-title">Passage infirmier</div>
            <div class="event-details">Prise de  à jeun à domicile</div>
        </article>

        <article class="event-card">
            <div class="event-date">Lundi 23 Novembre &mdash; 15h00</div>
            <div class="event-title">Visite de Claire & les enfants</div>
            <div class="event-details">Goûter à la maison</div>
        </article>
    </main>

</body>
</html>
