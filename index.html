<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Rafraichissement automatique toutes les 5 minutes -->
    <meta http-equiv="refresh" content="300">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Agenda Parents</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Bandeau date sur toute la largeur -->
    <div id="bandeau-date">Chargement...</div>

    <header>
        <h1>Prochains Rendez-vous</h1>
    </header>

    <main>
        <!-- Rendez-vous aujourd'hui -->
        <article class="event-card today">
            <div class="event-date">AUJOURD'HUI &mdash; 14h30</div>
            <div class="event-title">Rendez-vous Docteur Martin</div>
            <div class="event-details">Cabinet des Lilas &bull; Ne pas oublier la carte Vitale</div>
        </article>

        <!-- Rendez-vous a venir -->
        <article class="event-card">
            <div class="event-date">Jeudi 19 Novembre &mdash; 10h00</div>
            <div class="event-title">Passage infirmier</div>
            <div class="event-details">Prise de sang a jeun a domicile</div>
        </article>
    </main>

    <!-- Script de date compatible iOS 9 -->
    <script>
        (function() {
            var jours = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
            var mois = ['janvier', 'fevrier', 'mars', 'avril', 'mai', 'juin', 
                        'juillet', 'aout', 'septembre', 'octobre', 'novembre', 'decembre'];
            
            var d = new Date();
            var texte = jours[d.getDay()] + ' ' + d.getDate() + ' ' + mois[d.getMonth()] + ' ' + d.getFullYear();
            
            var el = document.getElementById('bandeau-date');
            if (el) {
                el.innerHTML = texte;
            }
        })();
    </script>
</body>
</html>
